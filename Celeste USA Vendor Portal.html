/* Letterhead */
.band{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden}
.band .wm{position:absolute;right:-60px;top:-70px;width:300px;height:300px;opacity:.08}
.band .wrap{padding-block:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .emblem{width:44px;height:44px;flex:none}
.wordmark{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.14em;line-height:1}
.wordmark small{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.42em;font-weight:600;margin-top:5px;opacity:.85}
.wordmark small::before,.wordmark small::after{content:"";height:1px;width:22px;background:currentColor}
.band .spacer{flex:1}
.tabs{display:flex;gap:4px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
.tabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--band-ink);opacity:.75}
.tabs button[aria-pressed="true"]{background:var(--band-ink);color:var(--band);opacity:1}
.tabs button:focus-visible{outline:2px solid var(--band-ink);outline-offset:2px}

.intro{padding-block:34px 20px;display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,5vw,48px);line-height:1.05;margin:0;text-wrap:balance}
.intro p{margin:0;max-width:68ch;color:var(--slate)}
.notice{border:1px solid var(--rule);background:var(--sheet);padding:10px 14px;border-radius:6px;font-size:13.5px;color:var(--slate);max-width:72ch}
.notice b{color:var(--ink)}

/* Workspace */
.work{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-bottom:64px;align-items:start}
@media (max-width:820px){.work{grid-template-columns:minmax(0,1fr)}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:18px}
@media (max-width:820px){.rail{position:static}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.steps button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.steps button:hover{background:var(--sheet)}
.steps button:focus-visible{outline:2px solid var(--focus)}
.steps .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--field-line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none}
.steps button[aria-current="step"]{color:var(--ink);background:var(--sheet);font-weight:600}
.steps button[aria-current="step"] .n{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.steps .done .n{border-color:var(--ink);color:var(--ink)}
@media (max-width:820px){.steps button{flex-direction:column;gap:4px;font-size:12px;text-align:center;padding:8px 4px}}
.refcard{border-top:1px solid var(--rule);padding-top:14px;display:grid;gap:8px;font-size:13px;color:var(--muted)}
.refcard .mono{font-family:var(--mono);color:var(--ink);font-size:13px}
@media (max-width:820px){.refcard{display:none}}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:clamp(18px,3vw,34px);min-width:0}
.sheet h2{font-family:var(--display);font-weight:600;font-size:30px;margin:0;line-height:1.1}
.sheet .lede{margin:6px 0 22px;color:var(--muted);font-style:italic;max-width:66ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.grid .full{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.f{display:grid;gap:6px;min-width:0}
.f label,.legend{font-size:13px;font-weight:600;letter-spacing:.01em}
.req{color:var(--bad);margin-left:2px}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],textarea,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:5px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.f.err input,.f.err textarea,.f.err select{border-color:var(--bad)}
.f .msg{font-size:12.5px;color:var(--bad)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.choice{display:flex;gap:10px;align-items:center;border:1px solid var(--field-line);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--field)}
.choice:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice input{accent-color:var(--ink);margin:0}
.section-rule{grid-column:1/-1;border:0;border-top:1px solid var(--rule);margin:6px 0}
.subhead{grid-column:1/-1;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:4px}

.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:28px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:18px}
.actions .right{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:5px;padding:10px 18px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.saved{font-size:12.5px;color:var(--muted)}

/* Documents */
.docs{display:grid;gap:10px}
.docrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.docrow .t{font-weight:600}
.docrow .files{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--ink);background:var(--paper);max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill button{all:unset;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Review summary */
.summary{display:grid;gap:18px}
.sumblock h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);border-top:1px solid var(--rule-strong)}
.kv>div{padding:8px 10px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.kv>div:nth-child(odd){font-weight:600;font-size:13.5px}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}.kv>div:nth-child(odd){border-bottom:0;padding-bottom:0}}
.agree{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid var(--field-line);border-radius:6px}
.agree input{margin-top:4px;accent-color:var(--ink)}

/* Status */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-draft{background:var(--paper);color:var(--muted);border:1px solid var(--rule)}
.s-submitted{background:var(--info-bg);color:var(--info)}
.s-in_review{background:var(--info-bg);color:var(--info)}
.s-info_requested{background:var(--warn-bg);color:var(--warn)}
.s-approved{background:var(--ok-bg);color:var(--ok)}
.s-declined{background:var(--bad-bg);color:var(--bad)}
.statuspanel{display:grid;gap:16px}
.timeline{list-style:none;margin:0;padding:0;border-left:1px solid var(--rule);display:grid;gap:14px}
.timeline li{padding-left:16px;position:relative}
.timeline li::before{content:"";position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.timeline .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.callout{border-left:3px solid var(--warn);background:var(--warn-bg);padding:12px 14px;border-radius:0 6px 6px 0}

/* Reviewer */
.rv{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;padding-bottom:64px;align-items:start}
@media (max-width:900px){.rv{grid-template-columns:minmax(0,1fr)}}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip .c{font-family:var(--mono);margin-left:6px;opacity:.7}
.list{display:grid;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--paper)}
.item[aria-current="true"]{box-shadow:inset 3px 0 0 var(--ink);background:var(--paper)}
.item:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty .emblem{width:40px;height:40px;opacity:.35;color:var(--ink)}
.decide{display:grid;gap:10px;border-top:1px solid var(--rule);padding-top:16px;margin-top:20px}
.decide .row{display:flex;gap:8px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
/* Catalog */
.catalog{display:grid;gap:14px;margin-top:18px;border:1px solid var(--rule-strong);border-radius:6px;padding:16px}
.catbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.catbar .right{display:flex;gap:10px;flex-wrap:wrap}
.catsteps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--slate)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;max-height:520px;overflow-y:auto}
table.cat{border-collapse:collapse;width:100%;font-size:13px;min-width:980px}
table.cat th{position:sticky;top:0;background:var(--ink);color:var(--sheet);text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap}
table.cat td{padding:7px 10px;border-top:1px solid var(--rule);vertical-align:top}
table.cat .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
table.cat td.img{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.cat td.img a{color:var(--info)}
table.cat tr.rerr td{background:var(--bad-bg)}
table.cat tr.rwarn td{background:var(--warn-bg)}
.rmsg{font-size:12px;color:var(--muted);margin-top:2px}
tr.rerr .rmsg{color:var(--bad)} tr.rwarn .rmsg{color:var(--warn)}
footer{border-top:1px solid var(--rule);padding-block:20px;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

const TEMPLATE_NAME="Celeste-USA-Product-Catalog-Template.xlsx";
const COLS=[["n","Product name"],["u","UOM"],["v","Volume"],["b","Brand"],["ci","Cost Including VAT"],["ce","Cost Excluding VAT"],["sp","Selling Price"],["m","Product Margin"],["img","Product Image Link"]];
const MAX_ROWS=1000;
const STATUS_LABEL={draft:"Draft",submitted:"Submitted",in_review:"In review",info_requested:"Info requested",approved:"Approved",declined:"Declined"};

const blank=()=>({status:"draft",ref:"",company:{name:"",address:"",regNumber:"",regPlace:"",nature:"",natureOther:""},contact:{name:"",designation:"",phone:"",email:""},notes:"",documents:{},declaration:{name:"",agreed:false},history:[],reviewerNote:""});
const S={view:"vendor",step:0,data:blank(),errors:{},loaded:false,saving:false,savedAt:null,canReview:false,queue:[],filter:"open",sel:null,names:{},catalog:null,pending:null,revCatalog:null,revCatalogFor:null};
let db=null,user=null,assets=null,downloads=null,uid=null,myRef=null,catRef=null,revUnsub=null;
const app=document.getElementById("app");
const $=s=>app.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>{if(!t)return"";const d=new Date(t);return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})};
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function newRef(){const d=new Date();return "CUSA-V-"+d.getFullYear().toString().slice(2)+String(d.getMonth()+1).padStart(2,"0")+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}
const editable=()=>["draft","info_requested"].includes(S.data.status);

/* ---------- validation ---------- */
function validate(step){
  const e={},c=S.data.company,p=S.data.contact;
  if(step===0){
    if(!c.name.trim())e["company.name"]="Enter your registered company name.";
    if(!c.address.trim())e["company.address"]="Enter the company's registered address.";
    if(!c.regNumber.trim())e["company.regNumber"]="Enter the business registration number.";
    if(!c.nature)e["company.nature"]="Choose the option that best describes your business.";
    if(c.nature==="Other"&&!c.natureOther.trim())e["company.natureOther"]="Describe your business.";
  }
  if(step===1){
    if(!p.name.trim())e["contact.name"]="Enter the contact person's name.";
    if(!p.designation.trim())e["contact.designation"]="Enter their job title.";
    if(!p.phone.trim())e["contact.phone"]="Enter a phone number we can reach.";
    if(!emailOk(p.email))e["contact.email"]="Enter a valid email address, like name@company.com.";
  }
  if(step===2&&assets){
    DOCS.filter(d=>d.required).forEach(d=>{if(!(S.data.documents[d.key]||[]).length)e["doc."+d.key]="Upload this document."});
  }
  if(step===3){
    if(!S.data.declaration.name.trim())e["declaration.name"]="Type your full name to sign.";
    if(!S.data.declaration.agreed)e["declaration.agreed"]="Confirm the declaration to submit.";
  }
  return e;
}
function stepDone(i){return Object.keys(validate(i)).length===0}

/* ---------- field helpers ---------- */
function get(path){return path.split(".").reduce((o,k)=>o?.[k],S.data)}
function setv(path,v){const ks=path.split(".");let o=S.data;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=v}
function field(path,label,{type="text",req=true,full=false,hint="",area=false,ph=""}={}){
  const id="f-"+path.replace(/\./g,"-"),err=S.errors[path],dis=editable()?"":"disabled";
  const ctl=area?`<textarea id="${id}" data-p="${path}" placeholder="${esc(ph)}" ${dis}>${esc(get(path))}</textarea>`
    :`<input id="${id}" data-p="${path}" type="${type}" value="${esc(get(path))}" placeholder="${esc(ph)}" autocomplete="off" ${dis}>`;
  return `<div class="f ${full?"full":""} ${err?"err":""}"><label for="${id}">${esc(label)}${req?'<span class="req" aria-hidden="true">*</span>':""}</label>${ctl}${hint?`<span class="hint">${esc(hint)}</span>`:""}${err?`<span class="msg">${esc(err)}</span>`:""}</div>`;
}

/* ---------- vendor view ---------- */
function renderVendor(){
  const d=S.data,st=d.status;
  if(!editable()) return renderStatusPage();
  const steps=STEPS.map((s,i)=>`<li><button type="button" data-step="${i}" class="${i!==S.step&&stepDone(i)?"done":""}" ${i===S.step?'aria-current="step"':""}><span class="n">${stepDone(i)&&i!==S.step?"✓":i+1}</span><span>${s}</span></button></li>`).join("");
  let body="";
  if(S.step===0) body=`<h2>Company information</h2><p class="lede">Your company's registered business details, as they appear on your registration documents.</p>
    <div class="grid">
      ${field("company.name","Company name",{full:true})}
      ${field("company.address","Company address",{area:true,full:true,ph:"Street, city, state / province, ZIP, country"})}
      ${field("company.regNumber","Business registration number",{hint:"EIN, state file number, or your country's registration number."})}
      ${field("company.regPlace","Business registration",{req:false,hint:"Country / state of registration and year registered."})}
      <fieldset class="f full ${S.errors["company.nature"]?"err":""}" style="border:0;padding:0;margin:0"><legend class="legend" style="margin-bottom:6px">Nature of business<span class="req" aria-hidden="true">*</span></legend>
        <div class="choices">${NATURE.map(n=>`<label class="choice"><input type="radio" name="nature" value="${n}" ${d.company.nature===n?"checked":""}> ${n}</label>`).join("")}</div>
        ${S.errors["company.nature"]?`<span class="msg">${S.errors["company.nature"]}</span>`:""}
      </fieldset>
      ${d.company.nature==="Other"?field("company.natureOther","Describe your business",{full:true}):""}
    </div>`;
  if(S.step===1) body=`<h2>Contact person</h2><p class="lede">The person responsible for coordinating with Celeste USA LLC.</p>
    <div class="grid">
      ${field("contact.name","Name")}${field("contact.designation","Designation",{ph:"e.g. Head of Sales"})}

const money=v=>v==null||v===""?"—":Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>v==null||v===""||!isFinite(v)?"—":(v*100).toFixed(1)+"%";
function catTable(rows,{limit=Infinity,issues=null}={}){
  const shown=rows.slice(0,limit);
  return `<div class="tablewrap"><table class="cat"><thead><tr><th class="num">#</th>${COLS.map(([k,l])=>`<th class="${["ci","ce","sp","m"].includes(k)?"num":""}">${l}</th>`).join("")}</tr></thead><tbody>${shown.map((r,i)=>{
    const is=issues?issues[i]:null;
    return `<tr class="${is?.err.length?"rerr":is?.warn.length?"rwarn":""}"><td class="num">${r.row||i+1}</td><td>${esc(r.n)}${is&&(is.err.length||is.warn.length)?`<div class="rmsg">${esc([...is.err,...is.warn].join(" · "))}</div>`:""}</td><td>${esc(r.u)||"—"}</td><td>${esc(r.v)||"—"}</td><td>${esc(r.b)||"—"}</td><td class="num">${money(r.ci)}</td><td class="num">${money(r.ce)}</td><td class="num">${money(r.sp)}</td><td class="num">${pct(r.m)}</td><td class="img">${/^https?:\/\//i.test(r.img||"")?`<a href="${esc(r.img)}" target="_blank" rel="noopener">${esc(r.img.replace(/^https?:\/\//,""))}</a>`:esc(r.img)||"—"}</td></tr>`}).join("")}</tbody></table></div>${rows.length>shown.length?`<p class="hint" style="margin:8px 0 0">Showing ${shown.length} of ${rows.length} products.</p>`:""}`;
}
function catStats(rows){
  const ms=rows.map(r=>r.m).filter(v=>v!=null&&isFinite(v));
  return {count:rows.length,brands:new Set(rows.map(r=>r.b).filter(Boolean)).size,avgMargin:ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:null};
}
function catalogBlock(){
  const c=S.catalog,p=S.pending;
  let inner;
  if(p){
    const errs=p.issues.filter(x=>x.err.length).length,warns=p.issues.filter(x=>!x.err.length&&x.warn.length).length;
    const order=p.rows.map((r,i)=>i).sort((a,b)=>(p.issues[b].err.length*2+p.issues[b].warn.length)-(p.issues[a].err.length*2+p.issues[a].warn.length));
    inner=`<div class="catbar"><div><b>${esc(p.fileName)}</b><div class="hint">${p.rows.length} products found${errs?` · <span style="color:var(--bad)">${errs} need fixing</span>`:""}${warns?` · <span style="color:var(--warn)">${warns} to check</span>`:""}</div></div>
      <div class="right"><button type="button" class="btn ghost" data-cat="cancel">Choose another file</button><button type="button" class="btn primary" data-cat="attach" ${errs?"disabled":""}>Attach catalog</button></div></div>
      ${errs?`<p class="hint" style="color:var(--bad);margin:0">Fix the rows marked in red in your spreadsheet, save it, and upload it again.</p>`:""}
      ${catTable(order.map(i=>p.rows[i]),{limit:50,issues:order.map(i=>p.issues[i])})}`;
  }else if(c&&c.rows?.length){
    const st=catStats(c.rows);
    inner=`<div class="catbar"><div><b>${esc(c.fileName)}</b><div class="hint">${st.count} products · ${st.brands} brand${st.brands===1?"":"s"} · average margin ${pct(st.avgMargin)} · attached ${fmt(c.uploadedAt)}</div></div>
      ${editable()?`<div class="right"><button type="button" class="btn ghost" data-cat="remove">Remove</button><label class="btn upl" for="cat-file">Replace<input id="cat-file" type="file" accept=".xlsx,.xls,.csv"></label></div>`:""}</div>
      ${catTable(c.rows,{limit:10})}`;
  }else{
    inner=`<ol class="catsteps"><li><b>Download the template.</b> It has the columns we need and an Instructions sheet.</li><li><b>Fill one product per row</b>, starting at row 3. Product Margin calculates itself.</li><li><b>Upload the saved file.</b> We check every row before you attach it.</li></ol>
      <div class="right" style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" data-cat="template">Download template (.xlsx)</button>
      <label class="btn primary upl" for="cat-file">Upload completed template<input id="cat-file" type="file" accept=".xlsx,.xls,.csv"></label></div>`;
  }
  return `<div class="catalog"><div><div class="t" style="font-weight:600">Product catalog / price list</div><div class="hint">Product name, UOM, volume, brand, costs including and excluding VAT, selling price, margin and image link for each product you want to list.</div></div>${inner}</div>`;
}
function numCell(v){if(v==null||v==="")return {v:null};if(typeof v==="number")return {v};const s=String(v).replace(/[^0-9.\-]/g,"");const n=parseFloat(s);return isFinite(n)&&s!==""?{v:n}:{v:null,bad:true}}
async function parseCatalog(file){
  if(!window.XLSX){toast("The spreadsheet reader didn't load. Reload the page and try again.");return}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:"array"})}catch(e){toast("Couldn't read "+file.name+". Save it as .xlsx and try again.");return}
  const ws=wb.Sheets["Products"]||wb.Sheets[wb.SheetNames.find(n=>n!=="Instructions")||wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,blankrows:false});
  const norm=s=>String(s).toLowerCase().replace(/[^a-z]/g,"");
  const hi=aoa.findIndex(r=>r.some(c=>norm(c)==="productname"));
  if(hi<0){toast("This file doesn't have the template's columns. Download the template and copy your products into it.");return}
  const idx={};COLS.forEach(([k,l])=>{idx[k]=aoa[hi].findIndex(c=>norm(c)===norm(l))});
  const missing=COLS.filter(([k])=>k!=="m"&&idx[k]<0).map(([,l])=>l);
  if(missing.length){toast("Missing columns: "+missing.join(", ")+". Use the Celeste USA template.");return}
  const rows=[],issues=[];
  for(let i=hi+1;i<aoa.length;i++){
    const a=aoa[i],g=k=>idx[k]<0?"":a[idx[k]];
    const n=String(g("n")).trim();
    if(!a.some(x=>String(x).trim()!==""))continue;
    if(/^example:/i.test(n))continue;
    const ci=numCell(g("ci")),ce=numCell(g("ce")),sp=numCell(g("sp")),mm=numCell(g("m"));
    let m=mm.v; if(m!=null&&m>1.5)m=m/100;
    if(sp.v&&ce.v!=null)m=(sp.v-ce.v)/sp.v;
    const r={row:i+1,n,u:String(g("u")).trim(),v:String(g("v")).trim(),b:String(g("b")).trim(),ci:ci.v,ce:ce.v,sp:sp.v,m:m==null?null:Math.round(m*10000)/10000,img:String(g("img")).trim()};
    const err=[],warn=[];
    if(!n)err.push("Product name is missing");
    if(ce.bad||ci.bad||sp.bad)err.push("A price isn't a number");
    if(ce.v==null&&!ce.bad)err.push("Cost Excluding VAT is missing");
    if(sp.v==null&&!sp.bad)err.push("Selling Price is missing");
    if(!r.u)warn.push("No UOM");
    if(sp.v!=null&&ce.v!=null&&sp.v<ce.v)warn.push("Selling price is below cost");
    if(ci.v!=null&&ce.v!=null&&ci.v<ce.v)warn.push("Cost incl. VAT is lower than excl. VAT");
    if(r.img&&!/^https?:\/\//i.test(r.img))warn.push("Image link should start with https://");
    rows.push(r);issues.push({err,warn});
  }
  if(!rows.length){toast("No products found. Add products from row 3 of the Products sheet.");return}
  if(rows.length>MAX_ROWS){toast(`This file has ${rows.length} products. Split it into files of up to ${MAX_ROWS} and contact Celeste USA for bulk listings.`);return}
  S.pending={fileName:file.name,rows,issues};render();
}
async function attachCatalog(){
  const p=S.pending;if(!p)return;
  const data={fileName:p.fileName,uploadedAt:Date.now(),rows:p.rows};
  if(catRef){try{await catRef.set(JSON.parse(JSON.stringify(data)))}catch(e){toast(e?.code==="quota_exceeded"?"This catalog is too large to store. Split it into smaller files.":"Couldn't attach the catalog. Try again.");return}}
  S.catalog=data;S.pending=null;S.data.catalogInfo={fileName:data.fileName,count:data.rows.length,uploadedAt:data.uploadedAt};render();scheduleSave();toast(`Catalog attached: ${data.rows.length} products`);
}
async function removeCatalog(){
  if(catRef){try{await catRef.delete()}catch(e){toast("Couldn't remove the catalog. Try again.");return}}
  S.catalog=null;delete S.data.catalogInfo;render();scheduleSave();
}

const LS="celeste-vendor-draft";

async function saveDraft(){
  if(!editable())return;
  if(!S.data.ref)S.data.ref=newRef();
  if(!myRef){try{localStorage.setItem(LS,JSON.stringify(S.data))}catch(e){}S.savedAt=Date.now();updateSaved();return}
  try{S.saving=true;updateSaved();await myRef.set(JSON.parse(JSON.stringify({...S.data,updatedAt:Date.now()})));S.savedAt=Date.now()}
  catch(e){if(e?.code==="invalid_argument"){myRef=null;toast("You can view this portal but not save to it. Ask Celeste USA for contributor access.")}else toast("Couldn't save your draft. Check your connection and keep going; we'll try again.")}
  finally{S.saving=false;updateSaved()}

function updateSaved(){const r=app.querySelector(".refcard");if(!r)return;r.children[1].textContent=S.data.ref||"Assigned when saved";r.children[2].textContent=S.saving?"Saving…":S.savedAt?"Draft saved "+fmt(S.savedAt):"Your progress saves as you go."}

async function submitApp(){
  const all={};[0,1,2,3].forEach(i=>Object.assign(all,validate(i)));
  if(Object.keys(all).length){S.errors=all;const first=[0,1,2,3].find(i=>!stepDone(i));S.step=first;render();toast("Some required details are missing. Fix the highlighted fields.");return}
  if(!myRef){toast("Submitting needs a signed-in session on the shared portal.");return}
  const now=Date.now(),re=S.data.status==="info_requested";
  if(!S.data.ref)S.data.ref=newRef();
  S.data.status="submitted";S.data.submittedAt=S.data.submittedAt||now;S.data.reviewerNote=S.data.reviewerNote||"";
  S.data.history=[...S.data.history,{at:now,status:"submitted",note:re?"Resubmitted with changes":""}];
  try{await myRef.set(JSON.parse(JSON.stringify({...S.data,updatedAt:now})));toast("Application submitted");render()}
  catch(e){S.data.status=re?"info_requested":"draft";S.data.history.pop();toast(e?.code==="invalid_argument"?"Your access doesn't allow submitting. Ask Celeste USA for contributor access.":"Couldn't submit. Check your connection and try again.");render()}
}

async function decide(act){
  const sel=S.queue.find(x=>x.id===S.sel);if(!sel)return;
  const note=(document.getElementById("rv-note")?.value||"").trim();
  if((act==="info_requested"||act==="declined")&&!note){toast("Add a note so the vendor knows what to do next.");document.getElementById("rv-note").focus();return}
  const now=Date.now(),hist=[...(sel.history||[]),{at:now,status:act,note,by:uid||""}];
  try{await db.doc("vendors/"+sel.id).update({status:act,reviewerNote:note||sel.reviewerNote||"",history:hist,updatedAt:now});toast(STATUS_LABEL[act]+": "+(sel.company?.name||""))}
  catch(e){toast("Couldn't update the application. Try again.")}
}

  if(p){setv(p,e.target.value);if(S.errors[p]){delete S.errors[p];const f=e.target.closest(".f");f?.classList.remove("err");f?.querySelector(".msg")?.remove()}scheduleSave()}
});
app.addEventListener("change",async e=>{
  const t=e.target;
  if(t.name==="nature"){S.data.company.nature=t.value;delete S.errors["company.nature"];render();scheduleSave()}
  if(t.id==="f-agree"){S.data.declaration.agreed=t.checked;delete S.errors["declaration.agreed"];scheduleSave()}
  if(t.id==="cat-file"&&t.files?.[0]){parseCatalog(t.files[0]);t.value=""}
  if(t.dataset.up&&t.files?.[0]){
    const file=t.files[0],key=t.dataset.up;
    if(file.size>20*1024*1024){toast("That file is over 20 MB. Upload a smaller copy.");return}
    toast("Uploading "+file.name+"…");
    try{const r=await assets.upload(file);(S.data.documents[key]=S.data.documents[key]||[]).push({id:r.id,name:file.name,size:file.size});delete S.errors["doc."+key];render();scheduleSave();toast("Uploaded "+file.name)}
    catch(err){toast("Couldn't upload "+file.name+". Try a PDF or image file.")}
  }
});
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.step!=null){S.step=+b.dataset.step;S.errors={};render();window.scrollTo({top:0})}
  if(b.id==="back"){S.step--;S.errors={};render();window.scrollTo({top:0})}
  if(b.dataset.rm){const [k,i]=b.dataset.rm.split(":");S.data.documents[k].splice(+i,1);render();scheduleSave()}
  if(b.dataset.f){S.filter=b.dataset.f;render()}
  if(b.dataset.sel){S.sel=b.dataset.sel;render();resolveNames();loadRevCatalog()}
  if(b.dataset.cat){const a=b.dataset.cat;
    if(a==="template")saveFile(TEMPLATE_NAME,b64bytes(TEMPLATE_B64));
    if(a==="cancel"){S.pending=null;render()}
    if(a==="attach")attachCatalog();
    if(a==="remove")removeCatalog();
    if(a==="export"&&S.revCatalog){const sel=S.queue.find(x=>x.id===S.sel);exportCatalog(S.revCatalog.rows,sel?.company?.name)}}
  if(b.dataset.act){decide(b.dataset.act)}
});
app.addEventListener("submit",e=>{
  e.preventDefault();
  if(S.step<STEPS.length-1){const er=validate(S.step);S.errors=er;if(Object.keys(er).length){render();app.querySelector(".f.err input,.f.err textarea,.f.err select")?.focus();return}saveDraft();S.step++;render();window.scrollTo({top:0})}
  else submitApp();
});
document.getElementById("tab-vendor").onclick=()=>{S.view="vendor";render()};
document.getElementById("tab-review").onclick=()=>{S.view="review";render()};

async function loadRevCatalog(){
  const id=S.sel;if(!db||!id||S.revCatalogFor===id)return;
  S.revCatalog=null;S.revCatalogFor=null;
  try{const snap=await db.doc("vendors/"+id+"/catalog/main").get();if(S.sel!==id)return;S.revCatalog=snap.exists?snap.data():null;S.revCatalogFor=id;if(S.view==="review")render()}catch(e){}
}
async function resolveNames(){
  if(!user)return;const sel=S.queue.find(x=>x.id===S.sel);if(!sel)return;
  const ids=[...new Set((sel.history||[]).map(h=>h.by).filter(Boolean))];if(!ids.length)return;
  try{const ps=await user.profiles(ids);let ch=false;ids.forEach(id=>{const n=ps?.[id]?.name||"";if(n&&S.names[id]!==n){S.names[id]=n;ch=true}});if(ch&&S.view==="review")render()}catch(e){}
}

/* ---------- boot ---------- */
function merge(base,src){src=src||{};return {...base,...src,company:{...base.company,...(src.company||{})},contact:{...base.contact,...(src.contact||{})},declaration:{...base.declaration,...(src.declaration||{})},documents:{...(src.documents||{})},history:Array.isArray(src.history)?src.history:[]}}
try{const raw=localStorage.getItem(LS);if(raw)S.data=merge(blank(),JSON.parse(raw))}catch(e){}
render();

(async()=>{
  const C=window.claude;if(!C?.use)return;
  [user,db,assets,downloads]=await Promise.all([C.use("user"),C.use("db"),C.use("assets"),C.use("downloads")]);
  if(user){try{uid=await user.id();S.canReview=await user.canEdit()}catch(e){}}
  if(db&&uid){
    myRef=db.doc("vendors/"+uid);
    catRef=db.doc("vendors/"+uid+"/catalog/main");
    catRef.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;S.catalog=snap.exists?snap.data():null;if(S.view==="vendor"&&!S.pending)render()},()=>{});
    myRef.onSnapshot(snap=>{
      if(snap.exists){const incoming=merge(blank(),snap.data());
        const typing=app.contains(document.activeElement)&&document.activeElement.matches("input,textarea");
        const statusChanged=incoming.status!==S.data.status;
        if(!snap.metadata.hasPendingWrites&&(statusChanged||!typing||!S.loaded)){S.data=incoming;S.loaded=true;if(S.view==="vendor")render()}}
      else if(!S.loaded){S.loaded=true;if(S.data.company.name)scheduleSave()}
    },()=>{});
  }else db=null;
  if(db&&S.canReview){
    db.collection("vendors").onSnapshot(snap=>{
      S.queue=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status&&x.status!=="draft").sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
      if(S.view==="review"){const n=document.getElementById("rv-note");const keep=n?.value;render();if(keep){const m=document.getElementById("rv-note");if(m)m.value=keep}}
      resolveNames();
      const cur=S.queue.find(x=>x.id===S.sel);
      if(cur&&S.revCatalogFor===cur.id&&(cur.catalogInfo?.uploadedAt||null)!==(S.revCatalog?.uploadedAt||null)){S.revCatalogFor=null;loadRevCatalog()}
    },()=>{});
  }
  render();
})();
})();
</script>
